# Every URL below points at the upstream project. Forked this tool? Repoint
# them at your repository, or delete this folder.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/DuvInc/site-audit-crawler/discussions
    about: Anything that is not a bug report or a concrete feature request.
  - name: Security issue
    url: https://github.com/DuvInc/site-audit-crawler/security/advisories/new
    about: Please report privately rather than in a public issue.
  - name: A problem with Search Console, treg, OpenRouter or a model
    url: https://openrouter.ai/docs
    about: Quotas, permissions and model behaviour belong with those services.
