name: CI

# Pull requests only get the default read-only token, and nothing here needs more. No secret is
# referenced, and `pull_request` (never `pull_request_target`) means a fork's code cannot reach one.
#
# What CI does NOT do: crawl a real site, call Search Console or a model. The tests run against a
# fixture site on localhost, a fake Search Console transport and a fake model client.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node --check bin/site-audit.mjs
